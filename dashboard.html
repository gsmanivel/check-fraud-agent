<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tier 3 Analyst Review</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:      #07090f;
    --bg-surface:   #0d1117;
    --bg-elevated:  #161b27;
    --bg-hover:     #1c2333;
    --bg-active:    #1a2a4a;
    --border:       #21283a;
    --border-light: #2d3748;

    --text-primary:   #e6edf3;
    --text-secondary: #8b949e;
    --text-muted:     #484f58;

    --blue:   #58a6ff;
    --blue-dim: #1f4068;
    --green:  #3fb950;
    --green-dim: #0d3320;
    --red:    #f85149;
    --red-dim: #3d1f1f;
    --orange: #e3b341;
    --orange-dim: #3d2c00;
    --purple: #bc8cff;
    --purple-dim: #2d1f4e;

    --risk-high-bg:   #3d1f1f;
    --risk-high-text: #f85149;
    --risk-med-bg:    #3d2c00;
    --risk-med-text:  #e3b341;
    --risk-low-bg:    #0d3320;
    --risk-low-text:  #3fb950;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
  }

  /* ── Header ── */
  header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(231,76,60,0.4);
  }

  .header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
  .header-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .queue-badge {
    background: var(--red);
    color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px;
    min-width: 22px; text-align: center;
    letter-spacing: 0.02em;
  }

  .btn-ghost {
    background: none; border: 1px solid var(--border-light);
    color: var(--text-secondary);
    padding: 5px 12px; border-radius: 6px; font-size: 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-muted); }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── Queue panel ── */
  .queue-panel {
    width: 340px; flex-shrink: 0;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .panel-label {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .queue-list { overflow-y: auto; flex: 1; }

  .queue-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .queue-item:hover { background: var(--bg-hover); }
  .queue-item.active {
    background: var(--bg-active);
    border-left: 2px solid var(--blue);
    padding-left: 14px;
  }

  .qi-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .qi-checknum { font-weight: 600; font-size: 13px; color: var(--text-primary); }
  .qi-amount   { font-weight: 700; font-size: 13px; color: var(--orange); }
  .qi-payee    { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .qi-bottom   { display: flex; gap: 6px; align-items: center; }
  .qi-time     { font-size: 10px; color: var(--text-muted); margin-left: auto; }

  /* ── Tags ── */
  .tag {
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .tag-structuring    { background: var(--purple-dim); color: var(--purple); border: 1px solid #5a3d8a; }
  .tag-altered        { background: var(--red-dim);    color: var(--red);    border: 1px solid #6b2b2b; }
  .tag-synthetic      { background: var(--orange-dim); color: var(--orange); border: 1px solid #6b4e00; }
  .tag-unknown        { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-light); }

  .risk-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px;
    letter-spacing: 0.03em;
  }
  .risk-high   { background: var(--risk-high-bg); color: var(--risk-high-text); }
  .risk-medium { background: var(--risk-med-bg);  color: var(--risk-med-text);  }
  .risk-low    { background: var(--risk-low-bg);  color: var(--risk-low-text);  }

  .queue-empty {
    padding: 60px 20px; text-align: center;
    color: var(--text-muted); font-size: 13px;
  }
  .queue-empty .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

  /* ── Detail panel ── */
  .detail-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); }

  .detail-placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .detail-placeholder .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.3; }
  .detail-placeholder p { font-size: 14px; }

  .detail-scroll { flex: 1; overflow-y: auto; }
  .detail-inner  { padding: 28px 32px; max-width: 960px; }

  /* ── Decision bar ── */
  .decision-bar {
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    padding: 12px 32px;
    display: none; gap: 10px; align-items: center;
    flex-shrink: 0;
  }
  .decision-bar.visible { display: flex; }
  .decision-bar label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .notes-input {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-light);
    color: var(--text-primary); padding: 8px 12px; border-radius: 6px;
    font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  .notes-input:focus { border-color: var(--blue); }
  .notes-input::placeholder { color: var(--text-muted); }

  .btn-approve, .btn-reject {
    padding: 8px 20px; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-approve { background: var(--green); color: #000; }
  .btn-reject  { background: var(--red);   color: #fff; }
  .btn-approve:hover, .btn-reject:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-approve:active, .btn-reject:active { transform: translateY(0); }
  .btn-approve:disabled, .btn-reject:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ── Detail sections ── */
  .detail-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px;
  }
  .detail-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .detail-header .meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }

  /* Escalation path */
  .esc-path {
    display: flex; align-items: stretch;
    background: var(--bg-elevated);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .esc-node {
    flex: 1; padding: 16px 20px; text-align: center;
    position: relative;
  }
  .esc-node + .esc-node {
    border-left: 1px solid var(--border);
  }
  .esc-node + .esc-node::before {
    content: '→';
    position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 14px;
    background: var(--bg-elevated); padding: 0 2px;
  }
  .esc-node-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px;
  }
  .esc-node-score {
    font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 6px;
  }
  .esc-node-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
  .col-red    { color: var(--red);    }
  .col-orange { color: var(--orange); }
  .col-blue   { color: var(--blue);   }
  .col-green  { color: var(--green);  }

  /* Stat cards */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    transition: border-color 0.15s;
  }
  .stat-card:hover { border-color: var(--border-light); }
  .stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
  .stat-value.amount { color: var(--orange); font-size: 22px; }
  .stat-sub   { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* Section */
  .section {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-surface);
  }
  .section-icon { font-size: 13px; }
  .section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text-secondary);
  }
  .section-count {
    margin-left: auto;
    font-size: 10px; color: var(--text-muted);
    background: var(--bg-elevated); padding: 1px 7px;
    border-radius: 10px; border: 1px solid var(--border);
  }
  .section-body { padding: 16px 18px; }

  /* Check detail grid */
  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    column-gap: 40px; row-gap: 0;
  }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .detail-row:last-child, .detail-row:nth-last-child(2):nth-child(odd) { border-bottom: none; }
  .dl { color: var(--text-secondary); flex-shrink: 0; padding-right: 12px; }
  .dv { color: var(--text-primary); font-weight: 500; text-align: right; word-break: break-all; }
  .dv.ok   { color: var(--green); }
  .dv.warn { color: var(--orange); }
  .dv.bad  { color: var(--red); }

  /* Indicators */
  .indicator-group { margin-bottom: 14px; }
  .indicator-group:last-child { margin-bottom: 0; }
  .indicator-group-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text-muted);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .indicator-group-label span {
    background: var(--bg-surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: 9px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; font-family: ui-monospace, monospace;
    padding: 3px 10px; border-radius: 5px;
  }
  .chip-t1 { background: #2c1f00; color: var(--orange); border: 1px solid #6b4e00; }
  .chip-t2 { background: var(--red-dim); color: var(--red); border: 1px solid #6b2b2b; }
  .chip-none { font-size: 12px; color: var(--text-muted); font-family: inherit; }

  /* Reasoning */
  .reasoning {
    font-size: 13px; line-height: 1.8;
    color: var(--text-secondary);
    white-space: pre-wrap; word-break: break-word;
  }

  /* Tool trace */
  .trace-list { display: flex; flex-direction: column; gap: 8px; }
  .trace-item {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .trace-item-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  .trace-icon {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--blue-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .trace-tool-name {
    font-size: 12px; font-weight: 600; font-family: ui-monospace, monospace;
    color: var(--blue);
  }
  .trace-step-num {
    margin-left: auto;
    font-size: 10px; color: var(--text-muted);
  }
  .trace-args { padding: 10px 14px; }
  .trace-arg-row {
    display: flex; gap: 12px; font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }
  .trace-arg-row:last-child { border-bottom: none; }
  .trace-arg-key   { color: var(--text-muted); font-family: ui-monospace, monospace; flex-shrink: 0; min-width: 120px; }
  .trace-arg-value { color: var(--text-primary); font-family: ui-monospace, monospace; word-break: break-all; }
  .trace-empty { font-size: 12px; color: var(--text-muted); padding: 8px 0; }

  /* Image */
  .check-image-wrap {
    border-radius: 6px; overflow: hidden;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    min-height: 100px;
    display: flex; align-items: center; justify-content: center;
  }
  .check-image-wrap img { max-width: 100%; max-height: 260px; object-fit: contain; display: block; }
  .img-na { font-size: 12px; color: var(--text-muted); padding: 24px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    padding: 11px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500; color: #fff;
    z-index: 1000; opacity: 0; transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .toast.show   { opacity: 1; transform: translateY(0); }
  .toast.success { background: #1a3d2b; color: var(--green); border-color: var(--green); }
  .toast.error   { background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .toast.info    { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">&#128270;</div>
  <div>
    <div class="header-title">Fraud Analyst Review</div>
    <div class="header-sub">Tier 3 — Human Decision Required</div>
  </div>
  <div class="header-right">
    <span class="queue-badge" id="queueCount">0</span>
    <button class="btn-ghost" onclick="loadQueue()">&#8635; Refresh</button>
  </div>
</header>

<div class="layout">
  <!-- Queue -->
  <div class="queue-panel">
    <div class="panel-label">Pending Review</div>
    <div class="queue-list" id="queueList">
      <div class="queue-empty"><div class="icon">&#9203;</div><p>Loading&hellip;</p></div>
    </div>
  </div>

  <!-- Detail -->
  <div class="detail-panel">
    <div class="detail-placeholder" id="detailPlaceholder">
      <div class="icon">&#128196;</div>
      <p>Select a check to begin review</p>
    </div>
    <div class="detail-scroll" id="detailScroll" style="display:none;">
      <div class="detail-inner" id="detailInner"></div>
    </div>
    <div class="decision-bar" id="decisionBar">
      <label>Notes</label>
      <input class="notes-input" id="analystNotes" type="text" placeholder="Optional notes for this decision…" />
      <button class="btn-approve" id="btnApprove" onclick="submitDecision('approve')">&#10003; Approve</button>
      <button class="btn-reject"  id="btnReject"  onclick="submitDecision('reject')">&#10007; Reject</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = window.location.origin;
  let currentCheck = null;
  let queueData = [];

  // ── Helpers ──────────────────────────────────────────────────────────────────

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  async function apiGet(path) {
    const r = await fetch(`${API_BASE}/api${path}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
  async function apiPost(path, body) {
    const r = await fetch(`${API_BASE}/api${path}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if (!r.ok) { const t = await r.text(); throw new Error(t||`HTTP ${r.status}`); }
    return r.json();
  }

  function showToast(msg, type='info') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    const m = Math.floor((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m/60);
    return h < 24 ? `${h}h ago` : `${Math.floor(h/24)}d ago`;
  }

  function patternTag(p) {
    if (!p) return '';
    const map = {
      structuring:        ['tag-structuring','Structuring'],
      altered_check:      ['tag-altered','Altered Check'],
      synthetic_identity: ['tag-synthetic','Synthetic ID'],
      unknown:            ['tag-unknown','Unknown'],
    };
    const [cls, label] = map[p] || ['tag-unknown', p];
    return `<span class="tag ${cls}">${label}</span>`;
  }

  function riskBadge(score) {
    if (score == null) return '';
    const cls = score >= 75 ? 'risk-high' : score >= 40 ? 'risk-medium' : 'risk-low';
    return `<span class="risk-badge ${cls}">Risk ${score}</span>`;
  }

  function toolIcon(name) {
    return {customer_lookup:'&#128100;',velocity_check:'&#128200;',signature_check:'&#9998;',
            fraud_pattern_search:'&#128269;',payee_verify:'&#128373;',escalate_to_human:'&#128226;'}[name]||'&#128295;';
  }

  // ── Queue ─────────────────────────────────────────────────────────────────────

  async function loadQueue() {
    try {
      const d = await apiGet('/checks/queue');
      queueData = d.queue || [];
      renderQueue();
      document.getElementById('queueCount').textContent = queueData.length;
    } catch(e) {
      showToast('Failed to load queue: ' + e.message, 'error');
      document.getElementById('queueList').innerHTML =
        '<div class="queue-empty"><div class="icon">&#9888;</div><p>Could not reach API</p></div>';
    }
  }

  function renderQueue() {
    const el = document.getElementById('queueList');
    if (!queueData.length) {
      el.innerHTML = '<div class="queue-empty"><div class="icon">&#10003;</div><p>No checks pending review</p></div>';
      return;
    }
    el.innerHTML = queueData.map((c,i) => `
      <div class="queue-item ${currentCheck?.id===c.id?'active':''}" onclick="selectCheck(${i})">
        <div class="qi-top">
          <span class="qi-checknum">#${esc(c.check_number||c.id.slice(0,8))}</span>
          <span class="qi-amount">$${(c.amount||0).toLocaleString('en-US',{minimumFractionDigits:2})}</span>
        </div>
        <div class="qi-payee">${esc(c.payee_name||'—')} &bull; ${esc(c.bank_name||'—')}</div>
        <div class="qi-bottom">
          ${patternTag(c.fraud_pattern)}
          ${riskBadge(c.risk_score)}
          <span class="qi-time">${timeAgo(c.tier3_assigned_at||c.updated_at)}</span>
        </div>
      </div>`).join('');
  }

  // ── Detail ────────────────────────────────────────────────────────────────────

  function selectCheck(idx) {
    currentCheck = queueData[idx];
    renderQueue();
    renderDetail(currentCheck);
  }

  function renderDetail(c) {
    document.getElementById('detailPlaceholder').style.display = 'none';
    document.getElementById('detailScroll').style.display = 'block';
    document.getElementById('decisionBar').classList.add('visible');
    document.getElementById('analystNotes').value = '';
    document.getElementById('btnApprove').disabled = false;
    document.getElementById('btnReject').disabled  = false;

    const t1Score  = c.tier1_risk_score ?? '—';
    const t2Score  = c.risk_score ?? '—';
    const ef       = c.extracted_fields || {};
    const t1Inds   = c.tier1_indicators || [];
    const t2Inds   = c.fraud_indicators  || [];
    const toolCalls= c.agent_tool_calls  || [];
    const reasoning= c.agent_reasoning   || '';

    const scoreClass = s => s >= 75 ? 'col-red' : s >= 40 ? 'col-orange' : 'col-green';

    // Check detail value coloring
    const micrVal = ef.micr_valid != null
      ? `<span class="dv ${ef.micr_valid?'ok':'bad'}">${ef.micr_valid?'Valid':'Invalid'}</span>` : '<span class="dv">—</span>';
    const sigVal  = ef.signature_present != null
      ? `<span class="dv ${ef.signature_present?'ok':'bad'}">${ef.signature_present?'Present':'Missing'}</span>` : '<span class="dv">—</span>';
    const ocrConf = ef.raw_ocr_confidence != null
      ? `<span class="dv ${ef.raw_ocr_confidence>=0.8?'ok':ef.raw_ocr_confidence>=0.6?'warn':'bad'}">${(ef.raw_ocr_confidence*100).toFixed(0)}%</span>` : '<span class="dv">—</span>';
    const mismatch= ef.amount_mismatch != null
      ? `<span class="dv ${ef.amount_mismatch?'bad':'ok'}">${ef.amount_mismatch?'Yes':'No'}</span>` : '<span class="dv">—</span>';

    // Tool trace HTML
    const traceHtml = toolCalls.length ? toolCalls.map((tc,i) => {
      const args  = tc.args || {};
      const argRows = Object.entries(args).map(([k,v]) =>
        `<div class="trace-arg-row">
          <span class="trace-arg-key">${esc(k)}</span>
          <span class="trace-arg-value">${esc(Array.isArray(v) ? v.join(', ') : String(v))}</span>
        </div>`).join('');
      return `
        <div class="trace-item">
          <div class="trace-item-header">
            <div class="trace-icon">${toolIcon(tc.tool)}</div>
            <span class="trace-tool-name">${esc(tc.tool)}</span>
            <span class="trace-step-num">Step ${i+1}</span>
          </div>
          <div class="trace-args">
            ${argRows || '<span class="trace-empty">No arguments</span>'}
          </div>
        </div>`;
    }).join('') : '<span class="trace-empty">No tool trace available</span>';

    document.getElementById('detailInner').innerHTML = `
      <div class="detail-header">
        <div>
          <h2>Check #${esc(c.check_number||c.id.slice(0,8))}</h2>
          <div class="meta">
            ID: ${esc(c.id)} &bull;
            Submitted: ${c.submission_date ? new Date(c.submission_date).toLocaleString() : '—'} &bull;
            Escalated: ${timeAgo(c.tier3_assigned_at||c.updated_at)}
          </div>
        </div>
      </div>

      <!-- Escalation path -->
      <div class="esc-path">
        <div class="esc-node">
          <div class="esc-node-label">Tier 1 — Rules Engine</div>
          <div class="esc-node-score ${scoreClass(t1Score)}">${t1Score}</div>
          <div class="esc-node-desc">Flagged ${t1Inds.length} indicator${t1Inds.length!==1?'s':''}<br>escalated for AI review</div>
        </div>
        <div class="esc-node">
          <div class="esc-node-label">Tier 2 — AI Agent</div>
          <div class="esc-node-score ${scoreClass(t2Score)}">${t2Score}</div>
          <div class="esc-node-desc">${esc((c.fraud_pattern||'unknown').replace(/_/g,' '))}<br>${toolCalls.length} tool calls made</div>
        </div>
        <div class="esc-node">
          <div class="esc-node-label">Tier 3 — You</div>
          <div class="esc-node-score col-blue">&#128100;</div>
          <div class="esc-node-desc">Human decision<br>required</div>
        </div>
      </div>

      <!-- Stat cards -->
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">Amount</div>
          <div class="stat-value amount">$${(c.amount||0).toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          <div class="stat-sub">${esc(c.memo||'No memo')}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Payee</div>
          <div class="stat-value" style="font-size:16px;">${esc(c.payee_name||'—')}</div>
          <div class="stat-sub">${esc(c.bank_name||'—')}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Risk Score</div>
          <div class="stat-value ${scoreClass(t2Score)}">${t2Score} <span style="font-size:13px;font-weight:400;color:var(--text-muted)">/ 100</span></div>
          <div class="stat-sub">${esc((c.fraud_pattern||'unknown').replace(/_/g,' '))}</div>
        </div>
      </div>

      <!-- Check details -->
      <div class="section">
        <div class="section-header">
          <span class="section-icon">&#128196;</span>
          <span class="section-title">Check Details</span>
        </div>
        <div class="section-body">
          <div class="detail-grid">
            <div class="detail-row"><span class="dl">Customer</span><span class="dv">${esc(c.customer_name||'—')}</span></div>
            <div class="detail-row"><span class="dl">Bank</span><span class="dv">${esc(c.bank_name||'—')}</span></div>
            <div class="detail-row"><span class="dl">Account</span><span class="dv">${esc(c.account_number||'—')}</span></div>
            <div class="detail-row"><span class="dl">Routing</span><span class="dv">${esc(c.routing_number||'—')}</span></div>
            <div class="detail-row"><span class="dl">Issue Date</span><span class="dv">${esc(c.issue_date||'—')}</span></div>
            <div class="detail-row"><span class="dl">Submitted</span><span class="dv">${c.submission_date?new Date(c.submission_date).toLocaleString():'—'}</span></div>
            <div class="detail-row"><span class="dl">MICR</span>${micrVal}</div>
            <div class="detail-row"><span class="dl">Signature</span>${sigVal}</div>
            <div class="detail-row"><span class="dl">OCR Confidence</span>${ocrConf}</div>
            <div class="detail-row"><span class="dl">Amount Mismatch</span>${mismatch}</div>
          </div>
        </div>
      </div>

      <!-- Fraud indicators -->
      <div class="section">
        <div class="section-header">
          <span class="section-icon">&#9888;</span>
          <span class="section-title">Fraud Indicators</span>
          <span class="section-count">${t1Inds.length + t2Inds.length} total</span>
        </div>
        <div class="section-body">
          <div class="indicator-group">
            <div class="indicator-group-label">Tier 1 — Rules Engine <span>${t1Inds.length}</span></div>
            <div class="chips">${t1Inds.length
              ? t1Inds.map(i=>`<span class="chip chip-t1">${esc(i)}</span>`).join('')
              : '<span class="chip-none">None detected</span>'}</div>
          </div>
          <div class="indicator-group">
            <div class="indicator-group-label">Tier 2 — AI Agent <span>${t2Inds.length}</span></div>
            <div class="chips">${t2Inds.length
              ? t2Inds.map(i=>`<span class="chip chip-t2">${esc(i)}</span>`).join('')
              : '<span class="chip-none">None detected</span>'}</div>
          </div>
        </div>
      </div>

      <!-- Agent reasoning -->
      <div class="section">
        <div class="section-header">
          <span class="section-icon">&#129504;</span>
          <span class="section-title">Agent Reasoning</span>
        </div>
        <div class="section-body">
          <div class="reasoning">${esc(reasoning||'No reasoning available.')}</div>
        </div>
      </div>

      <!-- Tool trace -->
      <div class="section">
        <div class="section-header">
          <span class="section-icon">&#128270;</span>
          <span class="section-title">Agent Tool Trace</span>
          <span class="section-count">${toolCalls.length} call${toolCalls.length!==1?'s':''}</span>
        </div>
        <div class="section-body">
          <div class="trace-list">${traceHtml}</div>
        </div>
      </div>

      <!-- Check image -->
      ${c.check_image_url ? `
      <div class="section">
        <div class="section-header">
          <span class="section-icon">&#128247;</span>
          <span class="section-title">Check Image</span>
        </div>
        <div class="section-body" style="padding:12px;">
          <div class="check-image-wrap">
            <img src="${esc(c.check_image_url)}" alt="Check"
              onerror="this.parentElement.innerHTML='<span class=img-na>Image unavailable</span>'" />
          </div>
        </div>
      </div>` : ''}
    `;

    document.getElementById('detailScroll').scrollTop = 0;
  }

  // ── Decision ──────────────────────────────────────────────────────────────────

  async function submitDecision(decision) {
    if (!currentCheck) return;
    const check = currentCheck;
    const notes = document.getElementById('analystNotes').value.trim();
    document.getElementById('btnApprove').disabled = true;
    document.getElementById('btnReject').disabled  = true;
    try {
      await apiPost(`/checks/${check.id}/decision`, {
        decision, analyst_id: 'analyst@dashboard',
        notes: notes || `${decision} via dashboard`
      });
      showToast(`Check #${check.check_number||check.id.slice(0,8)} — ${decision.toUpperCase()}`, 'success');
      queueData = queueData.filter(c => c.id !== check.id);
      currentCheck = null;
      document.getElementById('queueCount').textContent = queueData.length;
      renderQueue();
      document.getElementById('detailScroll').style.display = 'none';
      document.getElementById('decisionBar').classList.remove('visible');
      document.getElementById('detailPlaceholder').style.display = '';
    } catch(e) {
      showToast('Failed: ' + e.message, 'error');
      document.getElementById('btnApprove').disabled = false;
      document.getElementById('btnReject').disabled  = false;
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  loadQueue();
  setInterval(loadQueue, 30000);
</script>
</body>
</html>
