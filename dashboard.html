<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Fraud Analyst Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  header .logo {
    width: 32px;
    height: 32px;
    background: #ef4444;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
  header .subtitle { font-size: 12px; color: #64748b; margin-top: 1px; }

  header .queue-badge {
    margin-left: auto;
    background: #ef4444;
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    min-width: 24px;
    text-align: center;
  }

  header .refresh-btn {
    background: #334155;
    border: none;
    color: #94a3b8;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  header .refresh-btn:hover { background: #475569; color: #e2e8f0; }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Queue panel ── */
  .queue-panel {
    width: 400px;
    flex-shrink: 0;
    border-right: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 16px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
  }

  .queue-list {
    overflow-y: auto;
    flex: 1;
  }

  .queue-item {
    padding: 14px 16px;
    border-bottom: 1px solid #1e293b;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .queue-item:hover { background: #1e293b; }
  .queue-item.active { background: #1e3a5f; border-left: 3px solid #3b82f6; }

  .queue-item .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .queue-item .check-num { font-weight: 600; font-size: 14px; color: #f1f5f9; }
  .queue-item .amount {
    font-weight: 700;
    font-size: 14px;
    color: #fbbf24;
  }
  .queue-item .payee { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .queue-item .tags { display: flex; gap: 6px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tag-structuring    { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
  .tag-altered        { background: #dc262622; color: #f87171; border: 1px solid #dc262644; }
  .tag-synthetic      { background: #d9770622; color: #fb923c; border: 1px solid #d9770644; }
  .tag-unknown        { background: #33415522; color: #94a3b8; border: 1px solid #33415544; }

  .risk-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .risk-high   { background: #dc262630; color: #f87171; }
  .risk-medium { background: #d9770630; color: #fb923c; }
  .risk-low    { background: #16a34a30; color: #4ade80; }

  .queue-empty {
    padding: 40px 20px;
    text-align: center;
    color: #475569;
    font-size: 14px;
  }
  .queue-empty .icon { font-size: 40px; margin-bottom: 12px; }

  /* ── Detail panel ── */
  .detail-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #334155;
  }
  .detail-placeholder .icon { font-size: 56px; margin-bottom: 16px; }
  .detail-placeholder p { font-size: 15px; }

  .detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: none;
  }

  .detail-content.visible { display: block; }

  .detail-title {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }

  .detail-title h2 { font-size: 20px; font-weight: 700; color: #f1f5f9; }
  .detail-title .meta { font-size: 12px; color: #64748b; margin-top: 4px; }

  .action-buttons {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-approve { background: #16a34a; color: white; }
  .btn-reject  { background: #dc2626; color: white; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px;
  }

  .card-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 22px;
    font-weight: 700;
    color: #f1f5f9;
  }

  .card-value.amount-val { color: #fbbf24; }
  .card-value.risk-val-high   { color: #f87171; }
  .card-value.risk-val-medium { color: #fb923c; }
  .card-value.risk-val-low    { color: #4ade80; }

  .card-sub { font-size: 12px; color: #64748b; margin-top: 4px; }

  .section {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .indicators-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .indicator-chip {
    font-size: 11px;
    padding: 4px 10px;
    background: #dc262618;
    color: #f87171;
    border: 1px solid #dc262640;
    border-radius: 6px;
    font-family: monospace;
  }

  .reasoning-text {
    font-size: 13px;
    line-height: 1.7;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .trace-container {
    max-height: 320px;
    overflow-y: auto;
  }

  .trace-step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .trace-step:last-child { margin-bottom: 0; }

  .trace-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .trace-body { flex: 1; }
  .trace-tool { font-size: 12px; font-weight: 600; color: #93c5fd; font-family: monospace; }
  .trace-args { font-size: 11px; color: #64748b; margin-top: 2px; font-family: monospace; word-break: break-all; }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #33415540;
    font-size: 13px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #64748b; }
  .info-value { color: #e2e8f0; font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: white;
    z-index: 1000;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #16a34a; }
  .toast.error   { background: #dc2626; }
  .toast.info    { background: #2563eb; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">&#128270;</div>
  <div>
    <h1>Check Fraud Review</h1>
    <div class="subtitle">Analyst Decision Queue</div>
  </div>
  <span class="queue-badge" id="queueCount">0</span>
  <button class="refresh-btn" onclick="loadQueue()">&#8635; Refresh</button>
</header>

<div class="layout">
  <!-- Queue List -->
  <div class="queue-panel">
    <div class="panel-header">Pending Review</div>
    <div class="queue-list" id="queueList">
      <div class="queue-empty">
        <div class="icon">&#9203;</div>
        <p>Loading queue&hellip;</p>
      </div>
    </div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-panel">
    <div class="detail-placeholder" id="detailPlaceholder">
      <div class="icon">&#128196;</div>
      <p>Select a check to review</p>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = window.location.origin;
  let currentCheck = null;
  let queueData = [];

  // ── API helpers ──────────────────────────────────────────────────────────────

  async function apiGet(path) {
    const res = await fetch(`${API_BASE}/api${path}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(`${API_BASE}/api${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `HTTP ${res.status}`);
    }
    return res.json();
  }

  // ── Toast ────────────────────────────────────────────────────────────────────

  function showToast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => { el.classList.remove('show'); }, 3500);
  }

  // ── Queue loading ────────────────────────────────────────────────────────────

  async function loadQueue() {
    try {
      const data = await apiGet('/checks/queue');
      queueData = data.queue || [];
      renderQueue();
      document.getElementById('queueCount').textContent = queueData.length;
    } catch (e) {
      showToast('Failed to load queue: ' + e.message, 'error');
      document.getElementById('queueList').innerHTML = `
        <div class="queue-empty">
          <div class="icon">&#9888;</div>
          <p>Could not reach API</p>
        </div>`;
    }
  }

  function patternTag(pattern) {
    if (!pattern) return '';
    const map = {
      structuring:        ['tag-structuring', 'Structuring'],
      altered_check:      ['tag-altered',     'Altered Check'],
      synthetic_identity: ['tag-synthetic',   'Synthetic ID'],
      unknown:            ['tag-unknown',      'Unknown'],
    };
    const [cls, label] = map[pattern] || ['tag-unknown', pattern];
    return `<span class="tag ${cls}">${label}</span>`;
  }

  function riskPill(score) {
    if (score == null) return '';
    const cls = score >= 75 ? 'risk-high' : score >= 40 ? 'risk-medium' : 'risk-low';
    return `<span class="risk-pill ${cls}">Risk ${score}</span>`;
  }

  function renderQueue() {
    const el = document.getElementById('queueList');
    if (!queueData.length) {
      el.innerHTML = `<div class="queue-empty"><div class="icon">&#10003;</div><p>No checks pending review</p></div>`;
      return;
    }
    el.innerHTML = queueData.map((c, i) => `
      <div class="queue-item ${currentCheck && currentCheck.id === c.id ? 'active' : ''}"
           onclick="selectCheck(${i})">
        <div class="row1">
          <span class="check-num">#${c.check_number || c.id.slice(0, 8)}</span>
          <span class="amount">$${(c.amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
        </div>
        <div class="payee">${escHtml(c.payee_name || '—')}</div>
        <div class="tags">
          ${patternTag(c.fraud_pattern)}
          ${riskPill(c.risk_score)}
        </div>
      </div>`).join('');
  }

  // ── Detail rendering ─────────────────────────────────────────────────────────

  function selectCheck(idx) {
    currentCheck = queueData[idx];
    renderQueue(); // re-render to update active state
    renderDetail(currentCheck);
  }

  function riskClass(score) {
    if (score >= 75) return 'risk-val-high';
    if (score >= 40) return 'risk-val-medium';
    return 'risk-val-low';
  }

  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toolIcon(name) {
    const icons = {
      customer_lookup:      '&#128100;',
      velocity_check:       '&#128200;',
      signature_check:      '&#9998;',
      fraud_pattern_search: '&#128269;',
      payee_verify:         '&#128373;',
      escalate_to_human:    '&#128226;',
    };
    return icons[name] || '&#128295;';
  }

  function renderDetail(c) {
    document.getElementById('detailPlaceholder').style.display = 'none';
    const panel = document.getElementById('detailContent');
    panel.classList.add('visible');

    const indicators = (c.fraud_indicators || []);
    const reasoning  = c.agent_reasoning || '';
    let traceCalls   = [];

    // agent_reasoning may embed the full result JSON or just text
    try {
      const parsed = JSON.parse(reasoning.slice(reasoning.indexOf('{')));
      traceCalls = parsed.tool_calls_made || [];
    } catch (_) {}

    const assignedAt = c.tier3_assigned_at
      ? new Date(c.tier3_assigned_at).toLocaleString()
      : '—';

    const traceHtml = traceCalls.length
      ? traceCalls.map(tc => `
          <div class="trace-step">
            <div class="trace-icon">${toolIcon(tc.tool)}</div>
            <div class="trace-body">
              <div class="trace-tool">${escHtml(tc.tool)}</div>
              <div class="trace-args">${escHtml(JSON.stringify(tc.args))}</div>
            </div>
          </div>`).join('')
      : '<p style="color:#475569;font-size:13px;">No tool trace available</p>';

    const indicatorsHtml = indicators.length
      ? indicators.map(i => `<span class="indicator-chip">${escHtml(i)}</span>`).join('')
      : '<span style="color:#475569;font-size:13px;">None</span>';

    panel.innerHTML = `
      <div class="detail-title">
        <div>
          <h2>Check #${escHtml(c.check_number || c.id.slice(0,8))}</h2>
          <div class="meta">Escalated: ${assignedAt} &bull; Account: ${escHtml(c.account_number || '—')}</div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-approve" id="btnApprove" onclick="submitDecision('approve')">&#10003; Approve</button>
          <button class="btn btn-reject"  id="btnReject"  onclick="submitDecision('reject')">&#10007; Reject</button>
        </div>
      </div>

      <div class="cards-grid">
        <div class="card">
          <div class="card-label">Amount</div>
          <div class="card-value amount-val">$${(c.amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
          <div class="card-sub">&mdash;</div>
        </div>
        <div class="card">
          <div class="card-label">Payee</div>
          <div class="card-value" style="font-size:16px;">${escHtml(c.payee_name || '—')}</div>
          <div class="card-sub">&mdash;</div>
        </div>
        <div class="card">
          <div class="card-label">Risk Score</div>
          <div class="card-value ${riskClass(c.risk_score)}">${c.risk_score ?? '—'}</div>
          <div class="card-sub">out of 100</div>
        </div>
        <div class="card">
          <div class="card-label">Fraud Pattern</div>
          <div class="card-value" style="font-size:16px;">${escHtml((c.fraud_pattern || 'unknown').replace(/_/g,' '))}</div>
          <div class="card-sub">&mdash;</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">&#9888; Fraud Indicators</div>
        <div class="indicators-list">${indicatorsHtml}</div>
      </div>

      <div class="section">
        <div class="section-title">&#129504; Agent Reasoning</div>
        <div class="reasoning-text">${escHtml(reasoning || 'No reasoning provided.')}</div>
      </div>

      <div class="section">
        <div class="section-title">&#128270; Agent Tool Trace</div>
        <div class="trace-container">${traceHtml}</div>
      </div>
    `;
  }

  // ── Decision submission ──────────────────────────────────────────────────────

  async function submitDecision(decision) {
    if (!currentCheck) return;
    const check = currentCheck;
    const btnApprove = document.getElementById('btnApprove');
    const btnReject  = document.getElementById('btnReject');

    btnApprove.disabled = true;
    btnReject.disabled  = true;

    try {
      await apiPost(`/checks/${check.id}/decision`, {
        decision,
        analyst_id: 'analyst@dashboard',
        notes: `Decision made via dashboard: ${decision}`
      });
      showToast(`Check #${check.check_number || check.id.slice(0,8)} marked as ${decision.toUpperCase()}`, 'success');

      // Remove from queue and refresh
      queueData = queueData.filter(c => c.id !== check.id);
      currentCheck = null;
      document.getElementById('queueCount').textContent = queueData.length;
      renderQueue();
      document.getElementById('detailContent').classList.remove('visible');
      document.getElementById('detailPlaceholder').style.display = '';
    } catch (e) {
      showToast('Failed to submit decision: ' + e.message, 'error');
      btnApprove.disabled = false;
      btnReject.disabled  = false;
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  loadQueue();
  setInterval(loadQueue, 30000); // auto-refresh every 30s
</script>
</body>
</html>
