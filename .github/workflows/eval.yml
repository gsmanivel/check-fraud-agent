name: Agent Eval

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Which Tier-2 engine to evaluate"
        required: true
        default: both
        type: choice
        options: [native, sk, both]
      min_accuracy:
        description: "Minimum decision_accuracy (job fails below this)"
        required: false
        default: "0.6"

env:
  PYTHON_VERSION: "3.11"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run eval
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: "2024-10-21"
          AGENT_MAX_ITERATIONS: "6"
          AGENT_TIMEOUT_SECONDS: "60"
        run: |
          python tests/eval/run_eval.py \
            --engine ${{ inputs.engine }} \
            --min-accuracy ${{ inputs.min_accuracy }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.engine }}
          path: tests/eval/reports/
          retention-days: 30
