name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AZURE_FUNCTIONAPP_NAME: checkfraudagent-gphqemb0gtfubzgz
  AZURE_RESOURCE_GROUP: manman-rg
  AZURE_REGION: eastus2-01
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment package
        run: zip -r deploy.zip host.json requirements.txt function_app.py handlers/ dashboard.html

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --src deploy.zip

      - name: Smoke test deployed function
        run: |
          URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.${{ env.AZURE_REGION }}.azurewebsites.net/api/checks/queue"
          echo "Probing $URL"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed — function did not return 200 after 6 attempts."
          echo "Last response body:"
          cat /tmp/body.txt || true
          exit 1
