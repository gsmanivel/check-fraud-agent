name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize deploys against the same Function App.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_FUNCTIONAPP_NAME: checkfraudagent
  AZURE_FUNCTIONAPP_HOSTNAME: checkfraudagent.azurewebsites.net
  AZURE_RESOURCE_GROUP: manman-rg
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment package
        run: zip -r deploy.zip host.json requirements.txt function_app.py handlers/ dashboard.html

      # Flex Consumption requires the Azure Functions Action (or `az functionapp deploy`).
      # The legacy `az functionapp deployment source config-zip` writes only Kudu state
      # blobs on Flex and never updates released-package.zip, leaving the runtime on
      # stale code while reporting success.
      #
      # remote-build: true triggers Oryx to run `pip install -r requirements.txt`
      # server-side during deployment. Without it, the package ships source-only and
      # function_app.py imports fail at startup → zero registered functions.
      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy.zip
          remote-build: true

      - name: Smoke test deployed function
        run: |
          URL="https://${{ env.AZURE_FUNCTIONAPP_HOSTNAME }}/api/checks/queue"
          echo "Probing $URL"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed — function did not return 200 after 6 attempts."
          echo "Last response body:"
          cat /tmp/body.txt || true
          exit 1
